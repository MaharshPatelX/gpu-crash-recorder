[package]
name = "gpu-crash-recorder"
version = "0.1.0"
edition = "2024"
description = "A system-wide Windows diagnostic session recorder for GPU and game crashes"
license = "MIT"
repository = "https://github.com/MaharshPatelX/gpu-crash-recorder"
readme = "README.md"
keywords = ["amd", "gpu", "diagnostics", "windows", "presentmon"]
categories = ["hardware-support", "development-tools::debugging"]
build = "build.rs"

[[bin]]
name = "gpu-crash-recorder"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
csv = "1.3"
dirs = "6.0"
global-hotkey = "0.7"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
single-instance = "0.3"
sysinfo = "0.37"
tray-icon = "0.21"
winit = "0.30"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1.0"
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
